# Clips4U Oracle Always Free deployment
# Start from repository root: sudo docker compose -f oracle/compose.yaml up -d --build
# Only 80 and 443 are publicly exposed; the private API listens inside Docker.
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLIPS4U_IMPORT_KEY: "${CLIPS4U_IMPORT_KEY:?Create an access key in oracle/.env}"
      CLIPS4U_ALLOWED_ORIGIN: "https://8myztggm5j-eng.github.io"
    expose:
      - "10000"
    tmpfs:
      - /tmp:size=4g,mode=1777
    stop_grace_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIPS4U_DOMAIN: "${CLIPS4U_DOMAIN:?Set your domain in oracle/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
